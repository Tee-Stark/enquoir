name: CI pipeline

on:
  push: 
    branches: 
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: 
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  
jobs:
  lint:
    name: Lint & vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      
      - name: make lint
        run: make lint

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
  
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make test
  
  build:
    name: Build all binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: CGO_ENABLED=0 go build -trimpath ./...
  
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env

      - run: make up
      - run: make test-integration

      - name: Service logs on failure
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml --env-file .env logs --no-color
        
      - name: Tear down services
        if: always()
        run: make down
  
  e2e:
    name: End-to-end (sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [integration, build]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: sandbox-e2e
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
 
      - name: Create .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: printf '%s\n' "$ENV_FILE" | tr -d '\r' > .env
 
      # 1. Postgres + Temporal
      - run: make up
 
      # 2. Fund the sandbox USD account
      - run: make sandbox-setup
 
      # 3 + 4. Exactly one worker, then the API, in the background
      - name: Start worker and api
        run: |
          make worker > worker.log 2>&1 &
          make api    > api.log    2>&1 &
 
          # Wait for the API (adjust port/path to yours)
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/healthz > /dev/null; then
              echo "api is up"; break
            fi
            if [ "$i" = 30 ]; then
              echo "api never became healthy"; cat api.log; exit 1
            fi
            sleep 2
          done
 
          # Make sure the worker didn't crash on startup
          sleep 3
          if ! pgrep -f "cmd/worker" > /dev/null; then
            echo "worker exited"; cat worker.log; exit 1
          fi
 
      # 5. Run e2e
      - run: make e2e
 
      - name: Logs on failure
        if: failure()
        run: |
          echo "::group::worker.log"; cat worker.log || true; echo "::endgroup::"
          echo "::group::api.log";    cat api.log    || true; echo "::endgroup::"
          docker compose -f deploy/docker-compose.yml --env-file .env logs --no-color
 
      - name: make down
        if: always()
        run: make down