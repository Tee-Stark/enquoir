  /v1/commerce/mandate-requests:
    post:
      tags: [Commerce]
      operationId: requestMandate
      summary: Ask a customer for a mandate, or resolve a request already made
      description: |
        Freezes the terms and emails the customer a one-time consent link
        (1 hour). The response never contains the link. Repeating the request
        (same `external_id`, same terms) returns it without another email;
        different terms are `409 registration_conflict`.
      security:
        - merchantKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [external_id, customer_id, agent_id, funding_method_id, approval_mode, scope, expires_at]
              properties:
                external_id:
                  $ref: "#/components/schemas/ExternalID"
                customer_id:
                  type: string
                agent_id:
                  type: string
                funding_method_id:
                  type: string
                  description: One of this customer's funding methods.
                approval_mode:
                  $ref: "#/components/schemas/ApprovalMode"
                scope:
                  type: object
                  required: [currency, max_transaction_minor, max_cumulative_minor]
                  properties:
                    currency:
                      type: string
                      enum: [USD, EUR, GBP]
                    max_transaction_minor:
                      type: integer
                      minimum: 1
                      description: The most one purchase may cost, in minor units (cents).
                    max_cumulative_minor:
                      type: integer
                      minimum: 1
                      description: The most all purchases together may cost; at least max_transaction_minor.
                    max_transactions:
                      type: integer
                      minimum: 0
                      maximum: 100000
                      description: The most purchases; 0 or omitted for no limit.
                    allowed_categories:
                      type: array
                      maxItems: 50
                      items:
                        type: string
                      description: Product categories allowed; empty or omitted for any.
                expires_at:
                  type: string
                  format: date-time
                  description: In the future, at most 90 days ahead. Kept to the second.
      responses:
        "201":
          description: "Requested; the consent email is on its way."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateRequest"
        "200":
          description: "Already requested with these terms: the same request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/RegistrationConflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          $ref: "#/components/responses/MandatePartyUnusable"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commerce/mandate-requests/{id}:
    parameters:
      - $ref: "#/components/parameters/MandateRequestID"
    get:
      tags: [Commerce]
      operationId: getMandateRequest
      summary: Get a mandate request and the customer's decision
      security:
        - merchantKey: []
      responses:
        "200":
          description: "The request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commerce/mandates:
    get:
      tags: [Commerce]
      operationId: listMandates
      summary: List the merchant's mandates
      description: Newest first. What to show a customer who asks what they have allowed.
      security:
        - merchantKey: []
      parameters:
        - name: customer_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MandateStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of mandates.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Mandate"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commerce/mandates/{id}:
    parameters:
      - $ref: "#/components/parameters/MandateID"
    get:
      tags: [Commerce]
      operationId: getMandate
      summary: Get a mandate
      security:
        - merchantKey: []
      responses:
        "200":
          description: "The mandate."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mandate"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commerce/mandates/{id}/revoke:
    parameters:
      - $ref: "#/components/parameters/MandateID"
    post:
      tags: [Commerce]
      operationId: revokeMandate
      summary: Ask to revoke a mandate, for the customer
      description: |
        The mandate reads `revocation_pending` and grants nothing from now.
        Enquoir emails the customer a one-time link (1 hour) to confirm;
        only their confirmation revokes it. Unconfirmed, the request lapses
        at `revocation_expires_at` and the mandate is active again. Asking
        while one is pending, or after revocation, changes and sends nothing.
      security:
        - merchantKey: []
      responses:
        "202":
          description: "Asked: see `status` (`revocation_pending`, or `revoked` if it already was)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mandate"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/consent/view:
    post:
      tags: [Consent]
      operationId: viewConsent
      summary: Read the terms a consent link is for
      description: Does not spend the link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The `token` from the consent link.
      responses:
        "200":
          description: "The terms to show the customer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentView"
        "400":
          description: "The link is unknown, spent or expired, or its request was decided or has expired (`token_invalid`); or the body is not JSON."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/consent/approve:
    post:
      tags: [Consent]
      operationId: approveConsent
      summary: Approve the terms, as the customer
      description: |
        Creates the mandate and the consent record, and spends the link.
        `terms_hash` must be the hash of the terms the page showed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, terms_hash]
              properties:
                token:
                  type: string
                terms_hash:
                  type: string
                  description: The `terms.terms_hash` from POST /v1/consent/view.
      responses:
        "200":
          description: "Approved: the mandate."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentOutcome"
        "409":
          description: "terms_hash is not this request's (`terms_mismatch`). The link is not spent."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: "The link is unknown, spent or expired, or its request was decided or has expired (`token_invalid`); or the body is not JSON."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/consent/reject:
    post:
      tags: [Consent]
      operationId: rejectConsent
      summary: Reject the terms, as the customer
      description: Records the rejection and spends the link. No mandate is created.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The `token` from the consent link.
      responses:
        "200":
          description: "Rejected."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentOutcome"
        "400":
          description: "The link is unknown, spent or expired, or its request was decided or has expired (`token_invalid`); or the body is not JSON."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/consent/revocation/view:
    post:
      tags: [Consent]
      operationId: viewRevocation
      summary: Read the mandate a revocation link is for
      description: Does not spend the link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The `token` from the revocation link.
      responses:
        "200":
          description: The mandate, `revocation_pending`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mandate"
        "400":
          description: "The link is unknown, spent or expired, or no revocation is pending (`token_invalid`); or the body is not JSON."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/consent/revocation/confirm:
    post:
      tags: [Consent]
      operationId: confirmRevocation
      summary: Confirm the revocation, as the customer
      description: Revokes the mandate for good and spends the link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The `token` from the revocation link.
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mandate"
        "400":
          description: "The link is unknown, spent or expired, or no revocation is pending (`token_invalid`); or the body is not JSON."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commerce/checkouts:
    get:
      tags: [Commerce]
      operationId: listCheckouts
      summary: List the merchant's checkouts
      description: Newest first.
      security:
        - merchantKey: []
      parameters:
        - name: mandate_id
          in: query
          schema:
            type: string
        - name: customer_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: The effective status (see Checkout).
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: "One page of checkouts."
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Checkout"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Commerce]
      operationId: submitCheckout
      summary: Submit a checkout for evaluation against a mandate
      description: |
        From the merchant's server, priced by it: never prices an agent
        asserts. The body is decoded strictly: an undocumented field is a 400
        naming it. The decision is recorded and returned (201); repeating the
        same checkout (`external_id`) returns it (200); a changed one under
        the same `external_id` is `409 registration_conflict`. A mandate that
        is not this merchant's is `422 mandate_unknown`; every other failure
        is a recorded `denied` checkout with its reasons.
      security:
        - merchantKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [external_id, mandate_id, customer_id, agent_id, funding_method_id, checkout]
              properties:
                external_id:
                  $ref: "#/components/schemas/ExternalID"
                mandate_id:
                  type: string
                customer_id:
                  type: string
                agent_id:
                  type: string
                funding_method_id:
                  type: string
                checkout:
                  $ref: "#/components/schemas/CheckoutLines"
      responses:
        "201":
          description: "Evaluated: see `status` and `decision`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkout"
        "200":
          description: "Already submitted: the same checkout."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/RegistrationConflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: "The mandate is not this merchant's (`mandate_unknown`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commerce/checkouts/{id}:
    parameters:
      - $ref: "#/components/parameters/CheckoutID"
    get:
      tags: [Commerce]
      operationId: getCheckout
      summary: Get a checkout and its decision
      security:
        - merchantKey: []
      responses:
        "200":
          description: "The checkout."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkout"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commerce/checkouts/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/CheckoutID"
    post:
      tags: [Commerce]
      operationId: cancelCheckout
      summary: Cancel an authorized checkout, or one awaiting the customer
      description: |
        Releases what it counted against the mandate. Cancelling a cancelled
        checkout succeeds and changes nothing; anything else is `409
        checkout_not_cancelable`.
      security:
        - merchantKey: []
      responses:
        "200":
          description: "Cancelled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkout"
        "409":
          description: "Not authorized or awaiting approval (`checkout_not_cancelable`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/consent/checkout/view:
    post:
      tags: [Consent]
      operationId: viewCheckoutApproval
      summary: Read the checkout an approval link is for
      description: Does not spend the link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The `token` from the approval link.
      responses:
        "200":
          description: "The checkout to show the customer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkout"
        "400":
          description: "The link is unknown, spent or expired, or the checkout is no longer awaiting approval (`token_invalid`); or the body is not JSON."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/consent/checkout/approve:
    post:
      tags: [Consent]
      operationId: approveCheckout
      summary: Approve the checkout, as the customer
      description: |
        `checkout_hash` must be the one the page showed. The mandate's limits
        are checked again: a checkout that no longer fits comes back `denied`.
        Spends the link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, checkout_hash]
              properties:
                token:
                  type: string
                checkout_hash:
                  type: string
      responses:
        "200":
          description: "Decided: `authorized`, or `denied` on the recheck."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkout"
        "409":
          description: "Not the checkout awaiting approval (`checkout_mismatch`). The link is not spent."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "400":
          description: "The link is unknown, spent or expired, or the checkout is no longer awaiting approval (`token_invalid`); or the body is not JSON."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/consent/checkout/reject:
    post:
      tags: [Consent]
      operationId: rejectCheckout
      summary: Reject the checkout, as the customer
      description: Spends the link.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: The `token` from the approval link.
      responses:
        "200":
          description: "Rejected."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkout"
        "400":
          description: "The link is unknown, spent or expired, or the checkout is no longer awaiting approval (`token_invalid`); or the body is not JSON."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commerce/checkouts/{id}/grant:
    parameters:
      - $ref: "#/components/parameters/CheckoutID"
    post:
      tags: [Commerce]
      operationId: issueGrant
      summary: Issue (or reissue) the checkout's grant
      description: |
        The first grant of a checkout the customer approved, or a replacement
        for a lost one. The earlier secret stops working; the expiry stays the
        authorization's. The secret is in `authorization.grant`, only in this
        response.
      security:
        - merchantKey: []
      responses:
        "200":
          description: "Issued."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Checkout"
        "409":
          description: "Already redeemed (`grant_redeemed`), or no active authorization: not authorized, expired, cancelled or revoked (`grant_not_issuable`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commerce/grants/redeem:
    post:
      tags: [Commerce]
      operationId: redeemGrant
      summary: Redeem a grant before charging
      description: |
        Checks the grant is this merchant's, unredeemed, unrevoked, unexpired,
        for this checkout and version, and its mandate still active; then
        creates the one execution: charge `amount_minor` of `currency` to
        `funding_method`. Repeating it returns that execution (200), even after
        the 15 minutes: never a second. The body is decoded strictly.
      security:
        - merchantKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [grant, external_checkout_id, checkout_hash]
              properties:
                grant:
                  type: string
                  description: The `enq_gr_...` secret.
                external_checkout_id:
                  type: string
                checkout_hash:
                  type: string
                  description: The `checkout_hash` of the checkout being charged.
      responses:
        "201":
          description: "Redeemed: the execution."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "200":
          description: "Already redeemed: the same execution."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Execution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: "The grant is for another checkout or version (`redemption_mismatch`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: "Not this merchant's grant, made up or replaced (`grant_invalid`); expired (`grant_expired`); revoked (`grant_revoked`); or the mandate is paused, revoked or expired (`mandate_not_active`)."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commerce/executions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Commerce]
      operationId: getExecution
      summary: Get an execution, with its history
      security:
        - merchantKey: []
      responses:
        "200":
          description: "The execution and every report on it, in order."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commerce/executions:
    get:
      tags: [Commerce]
      operationId: listExecutions
      summary: List the merchant's executions
      description: Newest first.
      security:
        - merchantKey: []
      parameters:
        - name: status
          in: query
          description: "`unknown` is the reconciliation queue."
          schema:
            type: string
            enum: [pending, succeeded, failed, unknown]
        - name: mandate_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: "One page of executions."
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Execution"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commerce/executions/{id}/outcome:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Commerce]
      operationId: reportExecutionOutcome
      summary: Report a payment's outcome
      description: |
        Your own report after charging, or - with `provider_event_id` - a PSP
        webhook you verified. The outcome is your word; Enquoir checks it
        against the execution. A direct report can't resolve `unknown`: use
        `.../reconcile`.
      security:
        - merchantKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome, provider, amount_minor, currency]
              properties:
                outcome:
                  type: string
                  enum: [succeeded, failed, unknown]
                provider:
                  type: string
                provider_payment_reference:
                  type: string
                  description: The PSP's payment ID. Required for succeeded.
                provider_event_id:
                  type: string
                  description: A verified PSP webhook's event ID. Makes this a webhook report.
                amount_minor:
                  type: integer
                currency:
                  type: string
                failure_reason:
                  type: string
                  maxLength: 200
                  description: e.g. the PSP's decline code. Never card data.
      responses:
        "200":
          description: "Recorded: see `result` - applied, duplicate (nothing changed) or ignored (older than what is recorded)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionReportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: "Contradicts a finished payment (`outcome_conflict`), an unknown outcome needs reconciling (`reconciliation_required`), or the webhook event ID reported something else (`event_conflict`). Recorded for investigation."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: "Not the execution's amount, currency, provider or payment reference (`report_mismatch`). Recorded for investigation."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commerce/executions/{id}/reconcile:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Commerce]
      operationId: reconcileExecution
      summary: Report what a lookup at the PSP found
      description: |
        After looking the payment up at your PSP: resolves an `unknown`
        outcome. A finished payment can't be contradicted.
      security:
        - merchantKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [outcome, provider, amount_minor, currency]
              properties:
                outcome:
                  type: string
                  enum: [succeeded, failed, unknown]
                provider:
                  type: string
                provider_payment_reference:
                  type: string
                  description: The PSP's payment ID. Required for succeeded.
                amount_minor:
                  type: integer
                currency:
                  type: string
                failure_reason:
                  type: string
                  maxLength: 200
                  description: e.g. the PSP's decline code. Never card data.
      responses:
        "200":
          description: "Recorded: see `result` - applied, duplicate (nothing changed) or ignored (older than what is recorded)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionReportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: "Contradicts a finished payment (`outcome_conflict`), an unknown outcome needs reconciling (`reconciliation_required`), or the webhook event ID reported something else (`event_conflict`). Recorded for investigation."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: "Not the execution's amount, currency, provider or payment reference (`report_mismatch`). Recorded for investigation."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/merchant-integrations/{id}/checkouts:
