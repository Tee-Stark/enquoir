        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/merchant-integrations/{id}/executions:
    parameters:
      - $ref: "#/components/parameters/IntegrationID"
    get:
      tags: [Merchant integrations]
      operationId: listIntegrationExecutions
      summary: A merchant's executions, for the dashboard
      description: Read-only; any member.
      security:
        - session: []
      parameters:
        - name: status
          in: query
          description: "`unknown` is the reconciliation queue."
          schema:
            type: string
            enum: [pending, succeeded, failed, unknown]
        - name: mandate_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: "One page of executions."
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Execution"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/payments:
    get:
      tags: [History]
      operationId: listPayments
      summary: List payments over a period
      description: Newest first. Every filter is optional.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: state
          in: query
          description: Repeat the parameter, or separate values with commas.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/PaymentState"
          style: form
          explode: true
        - name: agent_id
          in: query
          schema:
            type: string
        - name: payee
          in: query
          description: A beneficiary ID.
          schema:
            type: string
        - name: currency
          in: query
          schema:
            type: string
            enum: [USD, EUR, GBP]
        - name: reference
          in: query
          description: Exact match.
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: One page of payments.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Payment"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/payments/{key}:
    get:
      tags: [History]
      operationId: getPayment
      summary: One payment in full
      description: |
        The payment, its hash-chained event history (each event with its
        recorded time and hashes), whether the chain verifies, and every
        attempt made for it - agent submissions and Airwallex calls - oldest
        first.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IntentKey"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/payments/{key}/replay:
    get:
      tags: [History]
      operationId: replayPayment
      summary: Every step a payment went through, for a replay animation
      description: |
        The payment's state transitions (its hash-chained events), the agent
        submissions and every Airwallex call, merged into one timeline in the
        order they happened. Each step says when it happened (absolute, offset
        from the first step, and gap since the previous one), how long it took,
        who acted, the state it moved from and to, and a ready-to-show title.
        The frontend plays the steps in order, spacing them by `delta_ms` (or
        any scale it likes); the backend supplies data only.

        Events and attempts are stamped by the same database clock, so the
        order does not depend on the clocks of the machines involved.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/IntentKey"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Replay"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/payments/{key}/approve:
    parameters:
      - $ref: "#/components/parameters/IntentKey"
    post:
      tags: [Payments]
      operationId: approveEscalatedPayment
      summary: Approve a payment the organisation's policy escalated
      description: |
        Owners and admins only, with a verified email. The payment must
        currently be AWAITING_APPROVAL. Rechecks the policy before
        authorizing - a decision that was fine when escalated can still
        be refused now. The member who created the paying agent cannot
        approve its own payment unless they are the organisation's only
        eligible owner or admin, in which case the exclusion is waived.
      security:
        - session: []
      responses:
        "204":
          description: Approved; the payment proceeds (or is denied on recheck).
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Forbidden, or the acting user is excluded from approving.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The payment is not currently awaiting approval.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/payments/{key}/reject:
    parameters:
      - $ref: "#/components/parameters/IntentKey"
    post:
      tags: [Payments]
      operationId: rejectEscalatedPayment
      summary: Reject a payment the organisation's policy escalated
      description: Owners and admins only. The payment must currently be AWAITING_APPROVAL. Unlike approval, rejection is never excluded - it is not a conflict of interest the way approval is.
      security:
        - session: []
      responses:
        "204":
          description: Rejected; the payment is denied.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The payment is not currently awaiting approval.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/analytics/summary:
    get:
      tags: [Analytics]
      operationId: analyticsSummary
      summary: An organisation's activity over a period
      description: Payments are counted by when they were created; attempts by when they started. Default period, the last 30 days.
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/TZ"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/analytics/timeseries:
    get:
      tags: [Analytics]
      operationId: analyticsTimeSeries
      summary: One metric over time, for a chart
      description: |
        Every bucket in the period is present for every group: zero for counts
        and sums, null for time_to_applied where there is no data. At most
        1000 buckets per request.

        | metric | value | group_by |
        |---|---|---|
        | payments | payments created | state, agent, currency, or none |
        | applied_volume | minor units of payments that reached APPLIED, by when they did | currency (always) |
        | time_to_applied | median milliseconds from submission to APPLIED | none |
        | submissions | agent submissions | outcome, agent, or none |
        | duplicates_prevented | submissions attached or deduplicated | agent, or none |
        | rail_calls | Airwallex calls | outcome, operation, or none |

        Grouping by agent gives agent IDs (`none` for Enquoir's own tooling);
        names are in GET /v1/agents.
      security:
        - session: []
      parameters:
        - name: metric
          in: query
          required: true
          schema:
            type: string
            enum: [payments, applied_volume, time_to_applied, submissions, duplicates_prevented, rail_calls]
        - name: interval
          in: query
          description: Bucket size. Weeks start on Monday. Default day.
          schema:
            type: string
            enum: [hour, day, week, month]
        - name: group_by
          in: query
          schema:
            type: string
            enum: [state, agent, currency, outcome, operation]
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/TZ"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The series.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSeries"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/attempts:
    get:
      tags: [History]
      operationId: listAttempts
      summary: List attempts
      description: |
        Every agent submission (`kind=agent_submission`) and every Airwallex
        call Enquoir made (`kind=rail_call`), newest first. Every filter is
        optional.
      security:
        - session: []
      parameters:
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/AttemptKind"
        - name: operation
          in: query
          schema:
            $ref: "#/components/schemas/AttemptOperation"
        - name: outcome
          in: query
          description: Repeat the parameter, or separate values with commas.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/AttemptOutcome"
          style: form
          explode: true
        - name: agent_id
          in: query
          schema:
            type: string
        - name: intent_key
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: One page of attempts.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attempt"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/intents:
    post:
      tags: [Payments]
      operationId: submitIntent
      summary: Submit a payment intent
      description: |
        Submitting the same intent again (same payee, amount, currency and
        reference) returns the same key and starts nothing new, however
        long after the first submission. The `reason` is recorded but is not
        part of the key, so an agent that rewords it on a retry still gets
        the same payment. The key is scoped to the submitting agent's
        organisation: two organisations submitting the identical intent get
        different keys.
      security:
        - agentKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitIntentRequest"
      responses:
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Accepted, or recognised as an intent already submitted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitIntentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          description: |
            The payee is not a beneficiary this organisation registered
            (`payee_unknown`). Register it with POST /v1/beneficiaries first.
            Nothing is started.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/intents/{key}:
    get:
      tags: [Payments]
      operationId: getIntent
      summary: Get an intent's state and history
      description: |
        Scoped to the authenticated agent's organisation: a key belonging to
        another organisation is `not_found`, never `forbidden`.
      security:
        - agentKey: []
      parameters:
        - $ref: "#/components/parameters/IntentKey"
      responses:
        "200":
          description: The intent's recorded state and hash-chained history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntentDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/beneficiaries:
    get:
      tags: [Beneficiaries]
      operationId: listBeneficiaries
      summary: List the organisation's payees
      description: Newest first. Dashboard-only.
      security:
        - session: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The payees.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Beneficiary"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Beneficiaries]
      operationId: registerBeneficiary
      summary: Register a payee
      description: |
        Registers a US company bank account paid in USD over ACH. Registering
        the same details again returns the same beneficiary: Airwallex's
        beneficiary create has no idempotency key, so Enquoir stores its own
        key on the rail and looks it up before ever creating one.

        The payee belongs to the registering organisation: only its agents can
        pay it. The same details registered by another organisation are a
        separate beneficiary.

        Agents register payees with their API key; members can too, from the
        dashboard, as operator or above with a verified email.
      security:
        - agentKey: []
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBeneficiaryRequest"
      responses:
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Registered, or found already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterBeneficiaryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "422":
          description: The rail refused the details; `detail` carries its reason. Code `rail_rejected`.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: enquoir_session
      description: The dashboard session cookie, set by sign-up and log-in.
    agentKey:
      type: http
      scheme: bearer
      description: An agent's API key, shown once at creation or rotation.
    merchantKey:
      type: http
      scheme: bearer
      description: |
        A merchant integration key (`enq_mk_...`), shown once when the
        integration is created or its key rotated. Only accepted on
        `/v1/commerce`.

  headers:
    SetSessionCookie:
      description: "`enquoir_session=<token>; Path=/; Max-Age=<ttl>; HttpOnly; SameSite=Lax` (plus `Secure` outside local development)."
      schema:
        type: string

  parameters:
    From:
      name: from
      in: query
      description: Start of the period, inclusive (RFC 3339).
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: End of the period, exclusive (RFC 3339).
      schema:
        type: string
        format: date-time
    TZ:
      name: tz
      in: query
      description: An IANA time zone, such as Africa/Lagos or America/New_York. Default UTC.
      schema:
        type: string
        examples: [Africa/Lagos]
    Limit:
      name: limit
      in: query
      description: Page size, 1 to 200. Default 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema:
        type: string
    IntegrationID:
      name: id
      in: path
      required: true
      schema:
        type: string
    CommerceCustomerID:
      name: id
      in: path
      required: true
      schema:
        type: string
    CommerceAgentID:
      name: id
      in: path
      required: true
      schema:
        type: string
    FundingMethodID:
      name: id
      in: path
      required: true
      schema:
        type: string
    MandateRequestID:
      name: id
      in: path
      required: true
      schema:
        type: string
    MandateID:
      name: id
      in: path
      required: true
      schema:
        type: string
    CheckoutID:
      name: id
      in: path
      required: true
      schema:
        type: string
    ExternalIDFilter:
      name: external_id
      in: query
      description: Only the record with this external ID.
      schema:
        type: string
    CommerceStatusFilter:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/CommerceStatus"
    AgentID:
      name: id
      in: path
      required: true
      schema:
        type: string
    IntentKey:
      name: key
      in: path
      required: true
      description: The intent key returned on submission.
      schema:
        type: string

  responses:
    BadRequest:
      description: The body is not valid JSON (`invalid_json`) or failed validation (`validation_failed`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such resource (`not_found`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BodyTooLarge:
      description: The request body is over the 64 KiB limit (`body_too_large`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        Your role does not allow this (`forbidden`; see Role), a browser sent
        it from an origin not in CORS_ALLOWED_ORIGINS (`forbidden_origin`),
        on log-in, the account belongs to no organisation (`no_organisation`),
        or the action needs a verified email address (`email_unverified`:
        creating or rotating agent keys, inviting, registering payees,
        creating, enabling or re-keying merchant integrations).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotImplemented:
      description: A placeholder; not built yet (`not_implemented`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: |
        Rate limited (`rate_limited`), or, on log-in, the account is locked
        for an hour after 10 failed log-ins (`account_locked`). Retry-After
        says when to try again, in seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CustomerNotBindable:
      description: |
        The customer is not one this merchant registered
        (`customer_unknown`), or is disabled (`customer_disabled`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MandatePartyUnusable:
      description: |
        Something the request names is not this merchant's, or is disabled:
        `customer_unknown`, `customer_disabled`, `agent_unknown`,
        `agent_disabled`, `funding_method_unknown` (also: not this
        customer's), `funding_method_disabled`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RegistrationConflict:
      description: |
        The merchant already registered this external ID with different
        details (`registration_conflict`). Repeating a registration is safe;
        changing one is not done by repeating it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    LastOwner:
      description: The change would leave the organisation without an owner (`last_owner`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: No valid session or API key (`unauthenticated`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Something failed on Enquoir's side (`internal_error`). Safe to retry.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      description: |
        An RFC 9457 problem details object. Branch on `code`, which is
        stable; `detail` is for people and may change.
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
          description: The HTTP status text.
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
          enum:
            - invalid_json
            - validation_failed
            - not_found
            - rail_rejected
            - internal_error
            - unauthenticated
            - invalid_credentials
            - email_taken
            - payee_unknown
            - policy_denied
            - not_awaiting_approval
            - approver_excluded
            - forbidden_origin
            - not_implemented
            - body_too_large
            - forbidden
            - no_organisation
            - email_unverified
            - already_verified
            - token_invalid
            - last_owner
            - already_member
            - rate_limited
            - account_locked
            - registration_conflict
            - customer_unknown
            - customer_disabled
            - agent_unknown
            - agent_disabled
            - funding_method_unknown
            - funding_method_disabled
            - terms_mismatch
            - mandate_unknown
            - checkout_mismatch
            - checkout_not_cancelable
            - grant_invalid
            - grant_expired
            - grant_revoked
            - grant_redeemed
            - grant_not_issuable
            - redemption_mismatch
            - mandate_not_active
            - report_mismatch
            - outcome_conflict
            - reconciliation_required
            - event_conflict
        field:
          type: string
          description: For `validation_failed`, the request field at fault, when known.

    SignUpRequest:
      type: object
      required: [email, password, organisation_name]
      properties:
        email:
          type: string
          format: email
          description: Compared case-insensitively.
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: 12 to 128 characters, not only whitespace.
        organisation_name:
          type: string
          minLength: 1
          maxLength: 100

    LogInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, email, email_verified, created_at]
      properties:
        id:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
          description: |
            Until true, the user can look around but cannot create agents,
            invite anyone or register payees.
        created_at:
          type: string
          format: date-time

    Organisation:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time

    NextCursor:
      type: [string, "null"]
      description: Pass as `cursor` for the next page; null on the last page.

    Money:
      type: object
      required: [minor_units, currency, amount]
      properties:
        minor_units:
          type: integer
          description: Integer minor units (cents). Use this for arithmetic.
        currency:
          type: string
          enum: [USD, EUR, GBP]
        amount:
          type: string
          description: Major units as a decimal string, for display.
          examples: ["10.50"]

    Ref:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: [string, "null"]

    PaymentState:
      type: string
      description: |
        A State, or RECEIVED: accepted by the API, not yet picked up by a
        worker (nothing has happened to it yet).
      enum: [RECEIVED, PROPOSED, AWAITING_APPROVAL, AUTHORIZED, IN_FLIGHT, UNKNOWN, APPLIED, FAILED, BLOCKED]

    Payment:
      type: object
      required: [key, state, terminal, amount, payee, reference, reason, agent, transfer_id, failure_reason, policy_version,
                 created_at, state_changed_at, submissions, rail_calls]
      properties:
        key:
          type: string
        state:
          $ref: "#/components/schemas/PaymentState"
        terminal:
          type: boolean
          description: True once nothing more will happen (APPLIED or BLOCKED).
        amount:
          $ref: "#/components/schemas/Money"
        payee:
          $ref: "#/components/schemas/Ref"
        reference:
          type: string
        reason:
          type: string
        agent:
          description: The agent that first submitted it. Null for payments submitted by Enquoir's own tooling.
          oneOf:
            - $ref: "#/components/schemas/Ref"
            - type: "null"
        transfer_id:
          type: [string, "null"]
          description: The Airwallex transfer, once APPLIED.
        failure_reason:
          type: [string, "null"]
          description: Why it is FAILED or BLOCKED.
        policy_version:
          type: [integer, "null"]
          description: The policy version that decided it (Allow or Escalate), null if no policy was configured at submission.
        created_at:
          type: string
          format: date-time
        state_changed_at:
          type: [string, "null"]
          format: date-time
        submissions:
          type: integer
          description: How many times agents submitted it.
        rail_calls:
          type: integer
          description: How many Airwallex calls Enquoir made for it.

    PaymentDetail:
      allOf:
        - $ref: "#/components/schemas/Payment"
        - type: object
          required: [events, chain, attempts]
          properties:
            events:
              type: array
              items:
                $ref: "#/components/schemas/RecordedEvent"
            chain:
              type: object
              required: [valid, error]
              properties:
                valid:
                  type: boolean
                  description: Whether the hash chain verifies end to end.
                error:
                  type: [string, "null"]
                  description: Where it breaks, if it does.
            attempts:
              type: array
              description: Oldest first.
              items:
                $ref: "#/components/schemas/Attempt"

    RecordedEvent:
      type: object
      required: [sequence_number, type, payload, recorded_at, hash, prev_hash]
      properties:
        sequence_number:
          type: integer
        type:
          $ref: "#/components/schemas/State"
        payload:
          type: string
        recorded_at:
          type: string
          format: date-time
          description: When it was stored. Not covered by the hash.
        hash:
          type: string
        prev_hash:
          type: string

    AttemptKind:
      type: string
      description: |
        - agent_submission: an agent called POST /v1/intents.
        - rail_call: Enquoir called Airwallex.
      enum: [agent_submission, rail_call]

    AttemptOperation:
      type: string
      enum: [submit_intent, create_transfer, get_transfer, find_transfer, create_beneficiary, find_beneficiary]

    AttemptOutcome:
      type: string
      description: |
        Agent submissions: started (a new payment began), attached (joined a
        run already starting), deduplicated (already had history; nothing
        started), invalid, payee_unknown, policy_denied (the organisation's
        spending policy denied it, or - until escalation exists - decided
        to escalate it), error.
        Rail calls: ok, not_found (a lookup found nothing), rejected (a clear
        no), ambiguous (outcome unclear: timeout, 5xx, network),
        duplicate_transfers, error, in_progress (under way), interrupted
        (started but never finished - the worker likely died mid-call).
      enum: [started, attached, deduplicated, invalid, payee_unknown, policy_denied, error,
             ok, not_found, rejected, ambiguous, duplicate_transfers, in_progress, interrupted]

    Attempt:
      type: object
      required: [id, kind, operation, outcome, intent_key, beneficiary_key, agent, request_id, transfer_id,
                 transfer_status, http_status, error_code, error_message, activity_attempt, details,
                 started_at, finished_at, duration_ms]
      properties:
        id:
          type: string
        kind:
          $ref: "#/components/schemas/AttemptKind"
        operation:
          $ref: "#/components/schemas/AttemptOperation"
        outcome:
          $ref: "#/components/schemas/AttemptOutcome"
        intent_key:
          type: [string, "null"]
          description: Null for a submission too invalid to derive a key, or a beneficiary call.
        beneficiary_key:
          type: [string, "null"]
        agent:
          description: For agent submissions.
          oneOf:
            - $ref: "#/components/schemas/Ref"
            - type: "null"
        request_id:
          type: [string, "null"]
          description: The Airwallex request_id sent (the intent key).
        transfer_id:
          type: [string, "null"]
        transfer_status:
          type: [string, "null"]
          description: The transfer's status as Airwallex reported it in this call.
        http_status:
          type: [integer, "null"]
          description: Airwallex's HTTP status, on a failed call it answered.
        error_code:
          type: [string, "null"]
          description: Airwallex's error code, such as fee_unknown.
        error_message:
          type: [string, "null"]
        activity_attempt:
          type: [integer, "null"]
          description: For rail calls, the durable workflow's attempt number for this call (2+ means a retry).
        details:
          type: object
          description: For submissions, what the agent sent (payee, amount, currency, reference, reason) and the state reported back.
          additionalProperties:
            type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
        duration_ms:
          type: [integer, "null"]

    AnalyticsPeriod:
      type: object
      required: [from, to, tz]
      properties:
        from:
          type: string
          format: date-time
          description: In the requested zone, with its offset.
        to:
          type: string
          format: date-time
        tz:
          type: string

    CountsByKey:
      type: object
      additionalProperties:
        type: integer

    AnalyticsSummary:
      type: object
      required: [period, payments, volume, submissions, rail_calls, time_to_applied]
      properties:
        period:
          $ref: "#/components/schemas/AnalyticsPeriod"
        payments:
          type: object
          required: [total, by_state, in_progress, blocked_by_policy, success_rate, recovered_from_unknown]
          properties:
            total:
              type: integer
            by_state:
              description: Every state, zeros included.
              $ref: "#/components/schemas/CountsByKey"
            in_progress:
              type: integer
              description: RECEIVED, PROPOSED, AUTHORIZED, IN_FLIGHT or UNKNOWN.
            blocked_by_policy:
              type: integer
            success_rate:
              type: [number, "null"]
              description: APPLIED / (APPLIED + FAILED), 0 to 1. BLOCKED is policy, not failure, so excluded. Null when nothing settled.
            recovered_from_unknown:
              type: integer
              description: Payments whose outcome was unclear (UNKNOWN) that Enquoir still resolved to APPLIED or FAILED without paying twice.
        volume:
          type: array
          description: Applied volume per currency.
          items:
            type: object
            required: [currency, applied_minor_units, applied_amount, applied_count]
            properties:
              currency:
                type: string
              applied_minor_units:
                type: integer
              applied_amount:
                type: string
              applied_count:
                type: integer
        submissions:
          type: object
          required: [total, by_outcome, duplicates_prevented, active_agents]
          properties:
            total:
              type: integer
            by_outcome:
              $ref: "#/components/schemas/CountsByKey"
            duplicates_prevented:
              type: integer
              description: Submissions that would have been a second payment without Enquoir (attached or deduplicated).
            active_agents:
              type: integer
        rail_calls:
          type: object
          required: [total, by_outcome]
          properties:
            total:
              type: integer
            by_outcome:
              $ref: "#/components/schemas/CountsByKey"
        time_to_applied:
          type: object
          required: [count, p50_ms, p95_ms]
          properties:
            count:
              type: integer
            p50_ms:
              type: [integer, "null"]
            p95_ms:
              type: [integer, "null"]

    TimeSeries:
      type: object
      required: [metric, interval, group_by, unit, period, buckets, series]
      properties:
        metric:
          type: string
        interval:
          type: string
        group_by:
          type: [string, "null"]
        unit:
          type: string
          enum: [count, minor_units, milliseconds]
        period:
          $ref: "#/components/schemas/AnalyticsPeriod"
        buckets:
          type: array
          description: Every bucket's start, in the requested zone - the x axis.
          items:
            type: string
            format: date-time
        series:
          type: array
          items:
            type: object
            required: [group, points]
            properties:
              group:
                type: string
                description: The group's value (e.g. APPLIED, USD, an agent ID), or "all" when ungrouped.
              points:
                type: array
                items:
                  type: object
                  required: [start, value]
                  properties:
                    start:
                      type: string
                      format: date-time
                    value:
                      type: [number, "null"]

    Replay:
      type: object
      required: [payment, started_at, ended_at, duration_ms, states, chain, steps]
      properties:
        payment:
          $ref: "#/components/schemas/Payment"
        started_at:
          type: [string, "null"]
          format: date-time
          description: The first step's time; null when there are no steps.
        ended_at:
          type: [string, "null"]
          format: date-time
        duration_ms:
          type: integer
          description: From the first step to the last.
        states:
          type: array
          description: The state path, in order, e.g. PROPOSED, AUTHORIZED, IN_FLIGHT, APPLIED.
          items:
            $ref: "#/components/schemas/State"
        chain:
          type: object
          required: [valid, error]
          properties:
            valid:
              type: boolean
            error:
              type: [string, "null"]
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ReplayStep"

    ReplayStep:
      type: object
      required: [index, at, offset_ms, delta_ms, duration_ms, type, actor, from_state, to_state, outcome, title, event, attempt]
      properties:
        index:
          type: integer
        at:
          type: string
          format: date-time
        offset_ms:
          type: integer
          description: Milliseconds since the first step.
        delta_ms:
          type: integer
          description: Milliseconds since the previous step.
        duration_ms:
          type: [integer, "null"]
          description: How long an attempt took; null for transitions and unfinished calls.
        type:
          type: string
          description: |
            - submission: an agent submitted the intent.
            - transition: the payment moved state (a recorded event).
            - rail_call: Enquoir called Airwallex.
          enum: [submission, transition, rail_call]
        actor:
          type: string
          description: Who acted. policy decides AUTHORIZED/BLOCKED; workflow is Enquoir's durable execution; rail is Airwallex.
          enum: [agent, policy, workflow, rail]
        from_state:
          type: [string, "null"]
          description: For transitions, the state before (null for the first).
        to_state:
          type: [string, "null"]
          description: For transitions, the state after.
        outcome:
          description: For submissions and rail calls.
          oneOf:
            - $ref: "#/components/schemas/AttemptOutcome"
            - type: "null"
        title:
          type: string
          description: A one-line description, ready to show.
        event:
          description: For transitions, the recorded event.
          oneOf:
            - type: object
              required: [sequence_number, payload, hash]
              properties:
                sequence_number:
                  type: integer
                payload:
                  type: string
                hash:
                  type: string
            - type: "null"
        attempt:
          description: For submissions and rail calls, the full attempt.
          oneOf:
            - $ref: "#/components/schemas/Attempt"
            - type: "null"

    Beneficiary:
      type: object
      required: [id, key, name, account_last4, routing_number, account_category, created_at]
      properties:
        id:
          type: string
          description: The rail's beneficiary ID; an intent's payee.
        key:
          type: string
        name:
          type: string
        account_last4:
          type: string
        routing_number:
          type: string
        account_category:
          type: string
          enum: [Checking, Savings]
        created_at:
          type: string
          format: date-time

    Agent:
      type: object
      required: [id, name, status, created_at, revoked_at, api_key]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [active, revoked]
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        api_key:
          description: The active key, without its secret. Null once revoked.
          oneOf:
            - $ref: "#/components/schemas/APIKey"
            - type: "null"

    APIKey:
      type: object
      required: [id, prefix, created_at, last_used_at]
      properties:
        id:
          type: string
        prefix:
          type: string
          description: The first 12 characters of the secret, to recognise it by.
          examples: [enq_sk_Ab3dE]
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
          description: Updated at most once a minute.

    IssuedAgent:
      type: object
      required: [agent, api_key]
      properties:
        agent:
          $ref: "#/components/schemas/Agent"
        api_key:
          type: object
          required: [id, prefix, secret, created_at]
          properties:
            id:
              type: string
            prefix:
              type: string
            secret:
              type: string
              description: The API key. Shown only in this response; Enquoir stores only its hash.
            created_at:
              type: string
              format: date-time

    CommerceStatus:
      type: string
      description: Whether a merchant integration, customer or agent may take part in commerce.
      enum: [active, disabled]

    ExternalID:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        The merchant's own reference, unique per merchant and compared
        exactly. Trimmed; no spaces or control characters inside.

    CurrencyRule:
      type: object
      description: One currency's limits within a policy version. Zero means unlimited on every field - there is no policy that blocks every payment in a currency while still naming a rule for it.
      required: [currency, max_transaction_minor, max_24h_minor, max_7d_minor, max_30d_minor, max_per_hour_count, approval_threshold_minor]
      properties:
        currency:
          type: string
          enum: [USD, EUR, GBP]
        max_transaction_minor:
          type: integer
          format: int64
        max_24h_minor:
          type: integer
          format: int64
        max_7d_minor:
          type: integer
          format: int64
        max_30d_minor:
          type: integer
          format: int64
        max_per_hour_count:
          type: integer
        approval_threshold_minor:
          type: integer
          format: int64
          description: Above this, a payment or checkout escalates for a human's approval.

    PolicyVersion:
      type: object
      required: [version, currency_rules, payee_allow, payee_block, category_block, created_at]
      properties:
        version:
          type: integer
          description: 0 means the organisation has never edited its policy - every limit is unlimited.
        currency_rules:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyRule"
        payee_allow:
          type: array
          items:
            type: string
          description: Treasury only. Empty means no allow-list restriction.
        payee_block:
          type: array
          items:
            type: string
          description: Treasury only.
        category_block:
          type: array
          items:
            type: string
          description: Commerce only.
        created_at:
          type: [string, "null"]
          format: date-time
          description: Null for the default, unedited version.
        created_by:
          type: string
          description: The user who saved this version. Omitted for the default, unedited version.

    UpdatePolicyRequest:
      type: object
      properties:
        currency_rules:
          type: array
          items:
            $ref: "#/components/schemas/CurrencyRule"
          description: An omitted currency defaults to unlimited on every field.
        payee_allow:
          type: array
          items:
            type: string
        payee_block:
          type: array
          items:
            type: string
        category_block:
          type: array
          items:
            type: string

    DryRunPolicyRequest:
      type: object
      required: [context, currency, amount_minor]
      properties:
        context:
          type: string
          enum: [treasury, commerce]
        currency:
          type: string
          enum: [USD, EUR, GBP]
        amount_minor:
          type: integer
          format: int64
        payee:
          type: string
          description: Treasury only.
        categories:
          type: array
          items:
            type: string
          description: Commerce only.

    PolicyDecision:
      type: object
      required: [outcome, reasons, policy_version]
      properties:
        outcome:
          type: string
          enum: [allow, deny, escalate]
          description: Deny beats escalate - escalate is only reached when nothing already denied.
        reasons:
          type: array
          items:
            type: object
            required: [code, detail]
            properties:
              code:
                type: string
                enum: [over_transaction_limit, over_24h_total, over_7d_total, over_30d_total, over_hourly_count,
                  payee_blocked, payee_not_allowed, category_blocked, no_currency_rule, over_approval_threshold]
              detail:
                type: string
        policy_version:
          type: integer

    MerchantIntegration:
      type: object
      required: [id, name, status, created_at, disabled_at, key]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/CommerceStatus"
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: [string, "null"]
          format: date-time
        key:
          description: The active key, without its secret; null once revoked.
          oneOf:
            - type: object
              required: [id, prefix, created_at, last_used_at]
              properties:
                id:
                  type: string
                prefix:
                  type: string
                  description: The first 12 characters of the key, to recognise it by.
                created_at:
                  type: string
                  format: date-time
                last_used_at:
                  type: [string, "null"]
                  format: date-time
            - type: "null"

    IssuedMerchantIntegration:
      type: object
      required: [integration, key]
      properties:
        integration:
          $ref: "#/components/schemas/MerchantIntegration"
        key:
          type: object
          required: [id, prefix, secret, created_at]
          properties:
            id:
              type: string
            prefix:
              type: string
            secret:
              type: string
              description: The integration key. Shown only in this response; Enquoir stores only its hash.
            created_at:
              type: string
              format: date-time

    FundingReference:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        The merchant's own ID for the saved payment method (its `mfm_...`),
        unique per merchant. Not the PSP token, and never a card number: a
        value with 12 or more digits in a row is refused.

    ProviderReference:
      type: string
      minLength: 1
      maxLength: 255
      description: |
        The PSP's ID for the saved payment method: Stripe's `pm_...`, Adyen's
        `storedPaymentMethodId`. Unique per merchant and provider. It charges
        nothing without your PSP secret key, which Enquoir never takes. A
        card number - 13 to 19 digits with a valid Luhn checksum - is refused.

    FundingMethod:
      type: object
      required: [id, customer_id, merchant_funding_method_id, provider_method_reference, provider, display, status, created_at, disabled_at]
      properties:
        id:
          type: string
          description: Enquoir's binding ID (`fmb_...`). Mandates name it.
        customer_id:
          type: string
        merchant_funding_method_id:
          type: [string, "null"]
        provider_method_reference:
          type: [string, "null"]
        provider:
          type: string
        display:
          type: object
          required: [brand, last_four]
          properties:
            brand:
              type: string
            last_four:
              type: [string, "null"]
              pattern: "^[0-9]{4}$"
        status:
          $ref: "#/components/schemas/CommerceStatus"
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: [string, "null"]
          format: date-time

    ApprovalMode:
      type: string
      enum: [autonomous, per_transaction]
      description: Purchases within the scope go ahead on their own, or each needs the customer's approval.

    MandateStatus:
      type: string
      enum: [active, suspended, revocation_pending, expired, revoked]
      description: |
        Only `active` grants anything. `suspended` while the customer, agent,
        funding method or integration is disabled; `revocation_pending` while
        a revocation awaits the customer's confirmation (at most an hour);
        `expired` after `expires_at`; `revoked` once the customer confirmed.

    MandateTerms:
      type: object
      description: Exactly what the customer is asked to approve, frozen with the request.
      required: [merchant, customer_id, agent, funding_method, approval_mode, scope, expires_at, terms_hash]
      properties:
        merchant:
          $ref: "#/components/schemas/NamedRef"
        customer_id:
          type: string
        agent:
          $ref: "#/components/schemas/NamedRef"
        funding_method:
          type: object
          required: [id, brand, last_four]
          properties:
            id:
              type: string
            brand:
              type: string
            last_four:
              type: [string, "null"]
        approval_mode:
          $ref: "#/components/schemas/ApprovalMode"
        scope:
          type: object
          required: [currency, max_transaction_minor, max_cumulative_minor, max_transactions, allowed_categories]
          properties:
            currency:
              type: string
            max_transaction_minor:
              type: integer
            max_cumulative_minor:
              type: integer
            max_transactions:
              type: [integer, "null"]
              description: null for no limit.
            allowed_categories:
              type: array
              items:
                type: string
              description: Empty for any.
        expires_at:
          type: string
          format: date-time
        terms_hash:
          type: string
          description: "`sha256:` and the SHA-256 of the canonical snapshot of these terms."

    NamedRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string

    MandateRequest:
      type: object
      required: [id, external_id, status, terms, created_at, expires_at, decided_at, mandate_id]
      properties:
        id:
          type: string
        external_id:
          $ref: "#/components/schemas/ExternalID"
        status:
          type: string
          enum: [pending, approved, rejected, expired]
        terms:
          $ref: "#/components/schemas/MandateTerms"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: When the request, and its consent link, stop working (1 hour).
        decided_at:
          type: [string, "null"]
          format: date-time
        mandate_id:
          type: [string, "null"]
          description: Once approved.

    Mandate:
      type: object
      required: [id, request_id, consent_record_id, status, terms, approved_at, revoked_at, revocation_expires_at, usage]
      properties:
        id:
          type: string
        request_id:
          type: string
        consent_record_id:
          type: string
          description: The customer's recorded consent.
        status:
          $ref: "#/components/schemas/MandateStatus"
        terms:
          $ref: "#/components/schemas/MandateTerms"
        approved_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        revocation_expires_at:
          type: [string, "null"]
          format: date-time
          description: While `revocation_pending`, when the request lapses unconfirmed.
        usage:
          description: What counts against it - on get and list; null elsewhere.
          oneOf:
            - type: object
              required: [currency, purchases, purchases_left, spent_minor, paid_minor, held_minor, remaining_minor]
              properties:
                currency:
                  type: string
                purchases:
                  type: integer
                purchases_left:
                  type: [integer, "null"]
                  description: null without a purchase limit.
                spent_minor:
                  type: integer
                  description: Paid plus held.
                paid_minor:
                  type: integer
                held_minor:
                  type: integer
                  description: Authorized or redeemed, not yet settled (pending or unknown).
                remaining_minor:
                  type: integer
            - type: "null"

    CheckoutLines:
      type: object
      additionalProperties: false
      required: [currency, items, shipping_minor, tax_minor, fees_minor, total_minor]
      description: |
        In minor units. `total_minor` must equal the items (quantity times
        unit price) plus shipping, tax and fees, and be positive.
      properties:
        currency:
          type: string
          enum: [USD, EUR, GBP]
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [product_id, name, category, quantity, unit_price_minor]
            properties:
              product_id:
                type: string
              name:
                type: string
              category:
                type: string
                description: Checked against the mandate's allowed categories.
              quantity:
                type: integer
                minimum: 1
                maximum: 10000
              unit_price_minor:
                type: integer
                minimum: 0
        shipping_minor:
          type: integer
          minimum: 0
        tax_minor:
          type: integer
          minimum: 0
        fees_minor:
          type: integer
          minimum: 0
        total_minor:
          type: integer
          minimum: 1

    Checkout:
      type: object
      required: [id, external_id, mandate_id, status, decision, checkout, checkout_hash, created_at, decided_at, approval_expires_at, canceled_at, authorization]
      properties:
        id:
          type: string
        external_id:
          type: string
        mandate_id:
          type: string
        status:
          type: string
          enum: [authorized, awaiting_customer_approval, denied, rejected, canceled, expired, redeemed, revoked, paid, payment_failed]
          description: |
            `expired`: awaited the customer past `approval_expires_at`, or its
            grant went unredeemed past `authorization.expires_at`. `redeemed`:
            its grant was redeemed (payment pending or unknown). `paid` and
            `payment_failed`: the reported outcome. `revoked`: its mandate was
            revoked before.
        decision:
          type: object
          required: [allowed, reasons]
          properties:
            allowed:
              type: boolean
              description: True only when `authorized`.
            reasons:
              type: array
              description: Every reason a `denied` checkout falls outside its mandate.
              items:
                type: object
                required: [code, detail]
                properties:
                  code:
                    type: string
                    description: |
                      A mandate-level reason (the customer's own consent doesn't
                      allow this), or a policy_-prefixed one (the organisation's
                      spending policy doesn't, decided before the mandate is ever
                      evaluated - the two never appear together in one checkout).
                    enum: [mandate_not_active, customer_mismatch, agent_mismatch, funding_method_mismatch, currency_mismatch,
                      over_transaction_limit, category_not_allowed, over_transaction_count, over_budget,
                      policy_over_transaction_limit, policy_over_24h_total, policy_over_7d_total, policy_over_30d_total,
                      policy_over_hourly_count, policy_payee_blocked, policy_payee_not_allowed, policy_category_blocked,
                      policy_no_currency_rule, policy_over_approval_threshold]
                  detail:
                    type: string
        checkout:
          type: object
          required: [customer_id, agent_id, funding_method_id, currency, items, shipping_minor, tax_minor, fees_minor, total_minor]
          properties:
            customer_id:
              type: string
            agent_id:
              type: string
            funding_method_id:
              type: string
            currency:
              type: string
            items:
              type: array
              items:
                type: object
                required: [product_id, name, category, quantity, unit_price_minor]
                properties:
                  product_id:
                    type: string
                  name:
                    type: string
                  category:
                    type: string
                  quantity:
                    type: integer
                  unit_price_minor:
                    type: integer
            shipping_minor:
              type: integer
            tax_minor:
              type: integer
            fees_minor:
              type: integer
            total_minor:
              type: integer
        checkout_hash:
          type: string
          description: "`sha256:` and the SHA-256 of the canonical snapshot of this checkout."
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, "null"]
          format: date-time
        approval_expires_at:
          type: [string, "null"]
          format: date-time
        canceled_at:
          type: [string, "null"]
          format: date-time
        authorization:
          description: Once authorized.
          oneOf:
            - $ref: "#/components/schemas/Authorization"
            - type: "null"

    Authorization:
      type: object
      required: [id, status, grant, grant_issued_at, created_at, expires_at, redeemed_at, revoked_at, execution_id]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [active, redeemed, expired, revoked]
        grant:
          type: [string, "null"]
          description: The grant's secret - only in the response that issued it.
        grant_issued_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: 15 minutes after the checkout was authorized.
        redeemed_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        execution_id:
          type: [string, "null"]

    Execution:
      type: object
      description: The one payment a redeemed grant permits.
      required: [id, authorization_id, checkout_id, external_checkout_id, checkout_hash, mandate_id, amount_minor, currency, funding_method, status,
        provider_payment_reference, failure_reason, idempotency_key, report_deadline, created_at, updated_at, finished_at]
      properties:
        id:
          type: string
        authorization_id:
          type: string
        checkout_id:
          type: string
        external_checkout_id:
          type: string
        checkout_hash:
          type: string
        mandate_id:
          type: string
        amount_minor:
          type: integer
        currency:
          type: string
        funding_method:
          type: object
          required: [id, provider, merchant_funding_method_id, provider_method_reference, brand, last_four]
          properties:
            id:
              type: string
            provider:
              type: string
            merchant_funding_method_id:
              type: [string, "null"]
            provider_method_reference:
              type: [string, "null"]
            brand:
              type: string
            last_four:
              type: [string, "null"]
        status:
          type: string
          enum: [pending, succeeded, failed, unknown]
          description: The outcome is the merchant's word, checked against the execution.
        provider_payment_reference:
          type: [string, "null"]
        failure_reason:
          type: [string, "null"]
        idempotency_key:
          type: string
          description: Send it as your PSP request's idempotency key.
        report_deadline:
          type: string
          format: date-time
          description: Still pending then, it is presumed unknown.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time

    ExecutionReportResult:
      allOf:
        - $ref: "#/components/schemas/Execution"
        - type: object
          required: [result]
          properties:
            result:
              type: string
              enum: [applied, duplicate, ignored]

    ExecutionDetail:
      allOf:
        - $ref: "#/components/schemas/Execution"
        - type: object
          required: [history]
          properties:
            history:
              type: array
              items:
                type: object
                required: [sequence, kind, source, outcome, status_after, provider_payment_reference, provider_event_id, amount_minor, currency, detail, at]
                properties:
                  sequence:
                    type: integer
                  kind:
                    type: string
                    enum: [redeemed, reported, duplicate, ignored, refused, swept]
                  source:
                    type: [string, "null"]
                    description: direct, webhook, reconciliation or sweep.
                  outcome:
                    type: [string, "null"]
                  status_after:
                    type: string
                  provider_payment_reference:
                    type: [string, "null"]
                  provider_event_id:
                    type: [string, "null"]
                  amount_minor:
                    type: [integer, "null"]
                  currency:
                    type: [string, "null"]
                  detail:
                    type: [string, "null"]
                    description: Why a report was refused, or the reported failure reason.
                  at:
                    type: string
                    format: date-time

    ConsentView:
      type: object
      required: [request_id, expires_at, terms]
      properties:
        request_id:
          type: string
        expires_at:
          type: string
          format: date-time
        terms:
          $ref: "#/components/schemas/MandateTerms"

    ConsentOutcome:
      type: object
      required: [request, mandate]
      properties:
        request:
          $ref: "#/components/schemas/MandateRequest"
        mandate:
          description: The mandate created, on approval; null on rejection.
          oneOf:
            - $ref: "#/components/schemas/Mandate"
            - type: "null"

    CommerceCustomer:
      type: object
      required: [id, external_id, email, status, created_at, disabled_at]
      properties:
        id:
          type: string
        external_id:
          $ref: "#/components/schemas/ExternalID"
        email:
          type: string
          description: Lower-cased. Where consent links will go.
        status:
          $ref: "#/components/schemas/CommerceStatus"
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: [string, "null"]
          format: date-time

    CommerceAgent:
      type: object
      required: [id, external_id, name, status, created_at, disabled_at]
      properties:
        id:
          type: string
        external_id:
          $ref: "#/components/schemas/ExternalID"
        name:
          type: string
        status:
          $ref: "#/components/schemas/CommerceStatus"
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: [string, "null"]
          format: date-time

    AuditEvent:
      type: object
      required: [id, action, actor, target, details, ip, at]
      properties:
        id:
          type: string
        action:
          type: string
        actor:
          description: |
            Who did it - a member, an agent acting with its key, or a merchant
            integration acting with its key.
          oneOf:
            - type: object
              required: [type, id, email, name]
              properties:
                type:
                  type: string
                  enum: [user, agent, merchant_integration]
                id:
                  type: string
                email:
                  type: [string, "null"]
                  description: For a user.
                name:
                  type: [string, "null"]
                  description: For an agent or a merchant integration.
            - type: "null"
        target:
          description: What it was done to.
          oneOf:
            - type: object
              required: [type, id]
              properties:
                type:
                  type: string
                  enum: [user, agent, invitation, payee, merchant_integration, commerce_customer, commerce_agent, commerce_funding_method, commerce_mandate_request, commerce_mandate, commerce_checkout, commerce_authorization, commerce_execution]
                id:
                  type: string
            - type: "null"
        details:
          type: object
          additionalProperties:
            type: string
        ip:
          type: [string, "null"]
        at:
          type: string
          format: date-time

    SessionInfo:
      type: object
      required: [id, organisation, created_at, expires_at, current]
      properties:
        id:
          type: string
        organisation:
          $ref: "#/components/schemas/Organisation"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean

    Member:
      type: object
      required: [user, role, joined_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        role:
          $ref: "#/components/schemas/Role"
        joined_at:
          type: string
          format: date-time

    Invitation:
      type: object
      required: [id, email, role, invited_by, created_at, expires_at]
      properties:
        id:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        invited_by:
          type: string
          description: The inviting member's user ID.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    Role:
      type: string
      description: |
        A member's role in an organisation.

        | | owner | admin | operator | viewer |
        |---|---|---|---|---|
        | View payments, attempts, replay, analytics, payees, agents, members, merchant integrations | ✓ | ✓ | ✓ | ✓ |
        | Create, rotate, revoke agents; register payees | ✓ | ✓ | ✓ | |
        | Invite and remove members, change roles up to admin; audit log | ✓ | ✓ | | |
        | Create, disable, enable merchant integrations; issue and revoke their keys | ✓ | ✓ | | |
        | Manage admins and owners | ✓ | | | |

        Nobody grants a role above their own; only an owner changes a member
        at their own level or above; an organisation always keeps an owner.
      enum: [owner, admin, operator, viewer]

    AuthSession:
      type: object
      required: [user, organisation, role, session]
      properties:
        user:
          $ref: "#/components/schemas/User"
        organisation:
          description: The organisation this session is bound to.
          $ref: "#/components/schemas/Organisation"
        role:
          $ref: "#/components/schemas/Role"
        organisations:
          type: array
          description: Every organisation the user belongs to (GET /v1/auth/session only).
          items:
            type: object
            required: [id, name, role]
            properties:
              id:
                type: string
              name:
                type: string
              role:
                $ref: "#/components/schemas/Role"
        session:
          type: object
          required: [expires_at]
          properties:
            expires_at:
              type: string
              format: date-time

    State:
      type: string
      description: |
        Where an intent is in its lifecycle. APPLIED and BLOCKED are final.
        - PROPOSED: received by the workflow.
        - AWAITING_APPROVAL: the organisation's policy escalated it, above
          the approval threshold; an owner or admin must approve or reject
          it within 24 hours, or it is denied.
        - AUTHORIZED: policy passed.
        - IN_FLIGHT: recorded, then sent to the rail.
        - UNKNOWN: the outcome is unclear; Enquoir looks it up before anything else.
        - APPLIED: the rail confirmed the transfer PAID.
        - FAILED: the rail rejected or cancelled it.
        - BLOCKED: policy refused it, or an escalation was rejected or
          expired; the rail was never called.
      enum: [PROPOSED, AWAITING_APPROVAL, AUTHORIZED, IN_FLIGHT, UNKNOWN, APPLIED, FAILED, BLOCKED]

    SubmitIntentRequest:
      type: object
      required: [payee, amount, currency, reference]
      properties:
        payee:
          type: string
          description: |
            The beneficiary ID returned by POST /v1/beneficiaries. It must be a
            payee this organisation registered.
        amount:
          type: string
          description: Major units as a decimal string with at most two decimals.
          examples: ["10.50"]
        currency:
          type: string
          enum: [USD, EUR, GBP, usd, eur, gbp]
        reference:
          type: string
          description: Your reference for the payment, such as an invoice number.
        reason:
          type: string
          description: Free text, recorded but not part of the intent key.

    SubmitIntentResponse:
      type: object
      required: [key, state, outcome]
      properties:
        key:
          type: string
          description: The intent key. Same intent, same key.
        state:
          $ref: "#/components/schemas/State"
        outcome:
          type: string
          description: |
            What this submission did.
            - started: a new payment began.
            - attached: the same intent was submitted moments ago and its run is starting; this joined it.
            - deduplicated: the intent already has a recorded history; nothing new started, `state` is where it stands.
          enum: [started, attached, deduplicated]

    Event:
      type: object
      required: [sequence_number, type, payload]
      properties:
        sequence_number:
          type: integer
        type:
          $ref: "#/components/schemas/State"
        payload:
          type: string

    IntentDetail:
      type: object
      required: [key, state, events]
      properties:
        key:
          type: string
        state:
          $ref: "#/components/schemas/State"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"

    RegisterBeneficiaryRequest:
      type: object
      required: [name, account_number, routing_number, account_category, address]
      properties:
        name:
          type: string
        account_number:
          type: string
          description: 4 to 17 digits.
        routing_number:
          type: string
          description: A 9-digit ABA routing number with a valid checksum.
        account_category:
          type: string
          enum: [Checking, Savings, checking, savings]
        address:
          type: object
          required: [street, city, state, postcode]
          properties:
            street:
              type: string
            city:
              type: string
            state:
              type: string
              description: A two-letter US state code, such as WA (US-WA is also accepted).
            postcode:
              type: string
              description: A 5-digit ZIP or ZIP+4.

    RegisterBeneficiaryResponse:
      type: object
      required: [id, key]
      properties:
        id:
          type: string
          description: The rail's beneficiary ID. Use it as an intent's payee.
        key:
          type: string
          description: Enquoir's key for these details.
