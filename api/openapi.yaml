      responses:
        "200":
          description: "The binding."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingMethod"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
