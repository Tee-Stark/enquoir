  /v1/commerce/funding-methods:
    post:
      tags: [Commerce]
      operationId: registerFundingMethod
      summary: Register a funding-method binding, or resolve one already registered
      description: |
        Binds one of the merchant's active customers to a payment method the
        merchant saved with its PSP, identified by the merchant's own
        reference for it, the PSP's (`pm_...`), or both. Never card details
        or PSP secret keys: undocumented fields are refused. Repeating it -
        by either reference - returns the same binding; repeating it with
        another customer, provider or display details, or adding or changing
        a reference, is `409 registration_conflict`, as are references that
        name two different bindings.
      security:
        - merchantKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [customer_id, provider, display]
              description: At least one of merchant_funding_method_id and provider_method_reference.
              properties:
                customer_id:
                  type: string
                  description: Enquoir's customer ID (`cus_...`), from POST /v1/commerce/customers.
                provider:
                  type: string
                  description: The PSP, e.g. `stripe`. Lower-cased.
                merchant_funding_method_id:
                  $ref: "#/components/schemas/FundingReference"
                provider_method_reference:
                  $ref: "#/components/schemas/ProviderReference"
                display:
                  type: object
                  additionalProperties: false
                  required: [brand]
                  properties:
                    brand:
                      type: string
                      description: e.g. `visa`, `paypal`. Letters, `_` and `-` only.
                    last_four:
                      type: string
                      pattern: "^[0-9]{4}$"
                      description: For cards and accounts; omit for wallets.
      responses:
        "201":
          description: "Registered."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingMethod"
        "200":
          description: "Already registered with these details: the same binding."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundingMethod"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/RegistrationConflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          $ref: "#/components/responses/CustomerNotBindable"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/commerce/funding-methods/{id}:
    parameters:
      - $ref: "#/components/parameters/FundingMethodID"
    get:
      tags: [Commerce]
      operationId: getFundingMethod
