          $ref: "#/components/responses/InternalError"
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List the organisation's agents
      description: Oldest first, revoked agents included.
      security:
        - session: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
