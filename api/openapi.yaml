openapi: 3.1.0
info:
  title: Enquoir API
  version: 0.10.0
  summary: The safe control and observability layer for agentic finance.
  description: |
    Enquoir sits between an AI agent and a payment rail. The agent states an
    intent; Enquoir derives a stable key from it, checks policy, executes it
    through a durable workflow, records every step before it acts, and
    reconciles unclear outcomes before anything is retried.

    The rail is Airwallex, **sandbox only**. No real money can move.

    **Authentication.** Agents send their API key as `Authorization: Bearer
    <key>` on the payment routes. The dashboard uses the `enquoir_session`
    cookie set by sign-up and log-in. A merchant's backend sends its
    integration key (`enq_mk_...`) as `Authorization: Bearer <key>` on the
    `/v1/commerce` routes. The two kinds of key are never interchangeable:
    an agent key is refused on commerce routes, a merchant key everywhere else. Dashboard frontends on another origin
    must be listed in the server's `CORS_ALLOWED_ORIGINS`; a state-changing
    request a browser sends from any other origin is refused
    (`403 forbidden_origin`).

    **Errors** are RFC 9457 problem details; branch on their `code`.

    **Limits.** Log-in: 5 a minute per email, 30 a minute per IP; 10 failures
    lock the email for an hour. Sign-up: 5 an hour per IP. Verification
    resends: 1 a minute, 5 a day. Password reset requests: 3 an hour per
    email. Password changes: 5 attempts per 15 minutes. Over a limit: 429 with Retry-After.
    Request bodies are limited to 64 KiB (`413 body_too_large`).
servers:
  - url: http://localhost:8090
    description: Local development
tags:
  - name: Accounts
    description: |
      Sign up, log in and out of the dashboard. Sessions are an HttpOnly
      cookie, `enquoir_session`, SameSite=Lax. Email verification and
      onboarding are placeholders until their requirements arrive.
  - name: Members
    description: |
      The people in an organisation and their roles (see the Role schema for
      what each may do). Members are invited by email; a role change or
      removal signs the member out of the organisation at once. An
      organisation always keeps at least one owner.
  - name: Agents
    description: |
      The AI agents that submit payments. Each agent has one API key,
      shown once when created or rotated; agents send it as
      `Authorization: Bearer <key>`. Managing agents needs a dashboard session.
  - name: Payments
    description: Payment intents submitted by agents.
  - name: Policies
    description: |
      One spending policy per organisation, versioned on every edit.
      Rules are per currency: a maximum per transaction, rolling 24h/7d/30d
      totals, a count per rolling hour, an approval threshold (above it a
      payment or checkout needs a human's approval), a treasury payee
      allow/block list and a commerce category block list. Evaluation is
      allow, deny (every reason) or escalate; deny beats escalate. Dry-run
      evaluates a candidate payment without moving or reserving anything.
      Owners and admins edit the policy and run dry-run; any member may
      read it.
  - name: Beneficiaries
    description: Payees registered on the rail before they can be paid.
  - name: History
    description: |
      What an organisation's agents did and what happened to every payment:
      payments over a period, each payment's full history, and every attempt
      (agent submissions and Airwallex calls). Dashboard-only: needs a session.
  - name: Analytics
    description: |
      Numbers for charts and trends, over any period, in any IANA time zone
      (`tz`, default UTC). Calendar buckets follow the caller's zone: days
      start at local midnight, also across daylight-saving changes. Money is
      never added up across currencies. Dashboard-only.
  - name: Merchant integrations
    description: |
      Merchant-delegated commerce, from the dashboard: connect a merchant
      (one integration per storefront) and manage its key. The key is how
      the merchant's backend authenticates on `/v1/commerce`. Owners and
      admins manage integrations; issuing or re-enabling a key needs a
      verified email. Any member may look.
  - name: Commerce
    description: |
      Merchant-delegated commerce, from the merchant's backend, with its
      integration key. A merchant registers the customers whose purchases
      its AI shopping agents will propose, and the agents themselves.
      Everything is scoped to the merchant the key belongs to - never to
      one named in a request; another merchant's record is `404`, even
      another storefront of the same organisation. External IDs are the
      merchant's own references, unique per merchant. Agents have no
      credentials of their own: the merchant names them.

      Registering is register-or-resolve: repeating it returns the same
      record (`200`); the first time, `201`. Repeating it with different
      details is `409 registration_conflict`.

      Funding methods are bindings to a customer's payment methods saved
      with the merchant's PSP: the merchant's own reference for the method,
      the PSP's own ID for it (`pm_...`), or both; the PSP's name; and what a
      consent screen shows (brand, last four). Enquoir returns its own
      binding ID (`fmb_...`). Registering a binding grants no spending
      authority.

      Enquoir never receives card data or PSP secrets. A funding-method
      request with any undocumented field is refused (`400
      validation_failed`, naming the field), as is any value holding 12 or
      more digits in a row - a card number's shape - in the merchant's
      reference, or a Luhn-valid card number in the PSP's.

      **Mandates** are spending authority, and only the customer grants
      them. The merchant requests one (`POST /v1/commerce/mandate-requests`)
      for one customer, one agent and one of that customer's funding
      methods, with a scope and an expiry (at most 90 days). Enquoir freezes
      the terms (hashed in `terms_hash`) and emails the customer a one-time
      link to its consent page, valid 1 hour. The merchant never receives
      the link and has no way to approve: poll the request, or list
      mandates, to see the customer's decision. Merchants then manage
      mandates for their customers: list, get, revoke. Revoking waits for
      the customer: the mandate pauses at once (`revocation_pending`) and
      Enquoir emails them a link to confirm. A mandate reads `suspended`
      while its customer, agent, funding method or integration is disabled,
      and `expired` after its expiry.

      **Checkouts** are evaluated against a mandate. The merchant's server -
      never the agent - submits the priced checkout (`POST
      /v1/commerce/checkouts`): items, shipping, tax, fees and a total that
      must add up, in minor units. Enquoir freezes it (`checkout_hash`) and
      decides, under a lock on the mandate so concurrent checkouts can't
      overspend it: `denied` with every reason, `authorized` at once under an
      autonomous mandate, or `awaiting_customer_approval` under a
      per-transaction one, when the customer is emailed a link (1 hour) to
      approve that exact checkout; limits are checked again then. Authorized
      checkouts count against the mandate's budget and purchase count at
      once; cancelling one releases it.

      **Grants.** An authorized checkout has an `authorization`, redeemable
      for 15 minutes from the decision, and a one-time grant (`enq_gr_...`)
      - its secret shown once: in the submit response for an autonomous
      checkout, or from `POST .../grant`, which (re)issues it, replacing any
      earlier secret without extending the 15 minutes. Before charging, the
      merchant redeems it (`POST /v1/commerce/grants/redeem`) naming the
      checkout's external ID and hash; that creates the one execution - the
      payment to make, and the funding method to charge - and repeating it
      returns the same execution. An unredeemed grant that expires stops
      counting against the mandate; cancelling the checkout or confirming
      the mandate's revocation revokes it. Enquoir records what it allowed;
      a grant is not a guarantee the payment will succeed at the PSP.

      **Outcomes.** Charge with the execution's `idempotency_key` as your
      PSP request's idempotency key, so a retried charge can't charge twice.
      Then report what happened (`POST /v1/commerce/executions/{id}/outcome`):
      `succeeded` (with the PSP's payment reference), `failed`, or `unknown`
      if your PSP call timed out. Forward a verified PSP webhook the same way
      with its `provider_event_id`: a redelivery changes nothing. **Outcomes
      are your word**: Enquoir checks them against the execution - amount,
      currency, provider, and the payment reference once known - but cannot
      verify them with the PSP. A succeeded payment stays spent against the
      mandate; a failed one is released; pending and unknown stay held.
      Unknown is not failed: only a reconciliation (`POST .../reconcile`,
      after looking the payment up at your PSP) or a webhook resolves it;
      `GET /v1/commerce/executions?status=unknown` is the queue. An
      execution left pending for 30 minutes is presumed unknown. A report
      contradicting a finished payment is refused and recorded; every report
      is in the execution's history.
  - name: Consent
    description: |
      The customer's consent page, at `APP_BASE_URL/consent?token=...`, the
      link Enquoir emails the customer. These routes take no credential but
      that token, sent in the body. The page shows the terms
      (`POST /v1/consent/view`, which doesn't spend the link), then approves
      - sending the `terms_hash` it showed, so consent binds to exactly those
      terms - or rejects. Either decision spends the link and is recorded,
      with the time, IP and user agent, as immutable evidence.

      When a merchant asks to revoke a mandate, Enquoir emails the customer a
      link to `APP_BASE_URL/consent/revoke?token=...`: the page shows the
      mandate (`POST /v1/consent/revocation/view`) and confirms
      (`POST /v1/consent/revocation/confirm`), which revokes it for good.

      Under a per-transaction mandate, each checkout's link goes to
      `APP_BASE_URL/consent/checkout?token=...`: the page shows the checkout
      (`POST /v1/consent/checkout/view`) and approves it - sending the
      `checkout_hash` it showed - or rejects it.
  - name: Meta
    description: Health and the API contract itself.

paths:
  /healthz:
    get:
      tags: [Meta]
      operationId: healthz
      summary: Liveness check
      responses:
        "200":
          description: The server is up.
          content:
            text/plain:
              schema:
                type: string
                const: ok

  /openapi.yaml:
    get:
      tags: [Meta]
      operationId: getOpenAPISpec
      summary: This OpenAPI document
      responses:
        "200":
          description: The OpenAPI 3.1 description of every route.
          content:
            application/yaml:
              schema:
                type: object
                description: An OpenAPI 3.1 document.
                required: [openapi, info, paths]

  /docs:
    get:
      tags: [Meta]
      operationId: getAPIDocs
      summary: Human-readable API reference
      description: An HTML page that renders /openapi.yaml.
      responses:
        "200":
          description: The API reference page.
          content:
            text/html:
              schema:
                type: string

  /v1/auth/signup:
    post:
      tags: [Accounts]
      operationId: signUp
      summary: Create an organisation and its owner
      description: |
        Creates a new organisation with the signing-up user as its owner, signs
        them in (sets the session cookie), and emails a verification link.
        Until they verify, they cannot create agents, invite anyone or register
        payees.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpRequest"
      responses:
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "403":
          $ref: "#/components/responses/Forbidden"
        "201":
          description: Signed up and signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: An account already uses this email (`email_taken`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/login:
    post:
      tags: [Accounts]
      operationId: logIn
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogInRequest"
      responses:
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: |
            The email and password don't match an account
            (`invalid_credentials`). The same answer whether or not the email
            is registered.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/logout:
    post:
      tags: [Accounts]
      operationId: logOut
      summary: Log out
      description: Revokes the current session and clears the cookie. Succeeds without a session too.
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "204":
          description: Logged out.
          headers:
            Set-Cookie:
              description: Clears `enquoir_session`.
              schema:
                type: string
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/switch-organisation:
    post:
      tags: [Accounts]
      operationId: switchOrganisation
      summary: Move the session to another organisation you belong to
      description: Issues a session bound to that organisation (a new cookie) and revokes the current one.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organisation_id]
              properties:
                organisation_id:
                  type: string
      responses:
        "200":
          description: Switched.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: You are not a member of that organisation (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/sessions:
    get:
      tags: [Accounts]
      operationId: listSessions
      summary: List your active sessions
      description: In every organisation, newest first; `current` marks the one making this request. Tokens are never shown.
      security:
        - session: []
      responses:
        "200":
          description: Your sessions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Accounts]
      operationId: revokeOtherSessions
      summary: Sign out everywhere else
      description: Revokes every session but the current one.
      security:
        - session: []
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/sessions/{id}:
    delete:
      tags: [Accounts]
      operationId: revokeSession
      summary: Sign out one of your sessions
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not one of your active sessions (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/activity:
    get:
      tags: [Accounts]
      operationId: listMyActivity
      summary: The security events on your own account
      description: |
        Everything done by you or to your account, in any organisation - and
        account-level events no organisation's log shows: email verified,
        password reset, account locked. Newest first.
      security:
        - session: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/session:
    get:
      tags: [Accounts]
      operationId: getSession
      summary: The signed-in user, their organisation and session
      security:
        - session: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "200":
          description: The current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/verify-email:
    post:
      tags: [Accounts]
      operationId: verifyEmail
      summary: Verify an email address with the emailed link's token
      description: |
        The frontend's `/verify-email?token=...` page posts the token here.
        A link works once and expires after 24 hours; asking for a new one
        spends the old. No session needed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          description: Verified.
        "400":
          description: The body is malformed, or the link is invalid, used or expired (`token_invalid`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/verify-email/resend:
    post:
      tags: [Accounts]
      operationId: resendVerificationEmail
      summary: Send a fresh verification link
      security:
        - session: []
      responses:
        "202":
          description: Queued for sending.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Already verified (`already_verified`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/password/forgot:
    post:
      tags: [Accounts]
      operationId: forgotPassword
      summary: Email a password-reset link
      description: |
        Always 202, whether or not the address has an account, so the answer
        never reveals which do. If it does, a link to the frontend's
        `/reset-password?token=...` is emailed; it works once and expires in
        1 hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        "202":
          description: Accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/password/reset:
    post:
      tags: [Accounts]
      operationId: resetPassword
      summary: Set a new password with a reset link's token
      description: |
        Signs the account out everywhere and emails a notice that the password
        changed. A password that fails the policy is rejected before the link
        is spent, so the user can try again with the same link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        "204":
          description: Password set.
        "400":
          description: The password fails the policy (`validation_failed`), or the link is invalid, used or expired (`token_invalid`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/auth/password/change:
    post:
      tags: [Accounts]
      operationId: changePassword
      summary: Change your password
      description: Needs the current password. Signs out every other session and emails a notice.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
                  minLength: 12
                  maxLength: 128
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Not signed in (`unauthenticated`), or the current password is wrong (`invalid_credentials`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/onboarding:
    get:
      tags: [Accounts]
      operationId: getOnboarding
      summary: Onboarding progress (placeholder)
      description: Not built yet - returns 501 until its requirements arrive.
      security:
        - session: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "501":
          $ref: "#/components/responses/NotImplemented"
    put:
      tags: [Accounts]
      operationId: updateOnboarding
      summary: Update onboarding progress (placeholder)
      description: Not built yet - returns 501 until its requirements arrive.
      security:
        - session: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /v1/members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: List the organisation's members
      security:
        - session: []
      responses:
        "200":
          description: The members, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/members/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: The member's user ID.
        schema:
          type: string
    patch:
      tags: [Members]
      operationId: changeMemberRole
      summary: Change a member's role
      description: Owners and admins. Signs the member out of the organisation so the new role applies at once.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastOwner"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a member, or leave
      description: |
        Any member may remove themselves (leave). Removing someone else needs
        a role above theirs (owners may remove anyone). The member is signed
        out of the organisation; their account and other organisations stay.
      security:
        - session: []
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastOwner"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/invitations:
    post:
      tags: [Members]
      operationId: inviteMember
      summary: Invite someone by email
      description: |
        Owners and admins with a verified email. Emails a link to the
        frontend's `/invitations/accept?token=...`, valid for 7 days. Inviting
        the same address again replaces the pending invitation. Nobody invites
        above their own role.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                role:
                  $ref: "#/components/schemas/Role"
      responses:
        "201":
          description: Invited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: The person is already a member (`already_member`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags: [Members]
      operationId: listInvitations
      summary: List pending invitations
      security:
        - session: []
      responses:
        "200":
          description: Pending invitations, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/invitations/{id}:
    delete:
      tags: [Members]
      operationId: revokeInvitation
      summary: Revoke a pending invitation
      description: Its link stops working.
      security:
        - session: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No such pending invitation in this organisation (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/invitations/accept:
    post:
      tags: [Members]
      operationId: acceptInvitation
      summary: Accept an invitation with the emailed link's token
      description: |
        No session needed. Holding the link proves the invited address, so:

        - **No account** at that address: `password` is required. The
          account is created, already verified, and signed in (the session
          cookie is set). `account_created: true`.
        - **An unverified account** at that address: `password` is required,
          and the account is claimed - the password replaces its password,
          every one of its sessions ends, and it is verified and signed in.
          `account_claimed: true`. Nobody had proved that account owns the
          address; without this, whoever signed up with someone else's email
          first would receive their invitation.
        - **A verified account**: it joins with the link alone; no password,
          no session - the person signs in as usual.

        A password that fails the policy is rejected before the link is spent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                password:
                  type: string
                  description: Required only when the address has no account.
      responses:
        "200":
          description: Joined.
          headers:
            Set-Cookie:
              description: Set when the account was created or claimed.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [organisation, role, user, account_created, account_claimed]
                properties:
                  organisation:
                    $ref: "#/components/schemas/Organisation"
                  role:
                    $ref: "#/components/schemas/Role"
                  user:
                    $ref: "#/components/schemas/User"
                  account_created:
                    type: boolean
                  account_claimed:
                    type: boolean
                    description: An unverified account at the address was claimed by the link's holder.
        "400":
          description: The password fails the policy (`validation_failed`), or the link is invalid, used, expired or revoked (`token_invalid`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Already a member (`already_member`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/audit-log:
    get:
      tags: [Members]
      operationId: listAuditLog
      summary: Account actions in the organisation
      description: |
        Owners and admins. Newest first. Actions: auth.logged_in,
        auth.password_changed, auth.sessions_revoked, member.invited,
        invitation.revoked, invitation.accepted, member.role_changed,
        member.removed, member.left, agent.created, agent.key_rotated,
        agent.revoked, payee.registered, merchant_integration.created,
        merchant_integration.disabled, merchant_integration.enabled,
        merchant_integration.key_rotated, merchant_integration.key_revoked,
        commerce.customer.registered, commerce.customer.disabled,
        commerce.customer.enabled, commerce.agent.registered,
        commerce.agent.disabled, commerce.agent.enabled,
        commerce.funding_method.registered, commerce.funding_method.disabled,
        commerce.funding_method.enabled, commerce.mandate.requested,
        commerce.mandate.approved, commerce.mandate.rejected,
        commerce.mandate.revocation_requested, commerce.mandate.revoked,
        commerce.checkout.authorized, commerce.checkout.denied,
        commerce.checkout.awaiting_approval, commerce.checkout.approved,
        commerce.checkout.rejected, commerce.checkout.canceled,
        commerce.authorization.grant_issued, commerce.authorization.redeemed,
        commerce.execution.succeeded, commerce.execution.failed,
        commerce.execution.unknown, commerce.execution.reconciled,
        commerce.execution.report_refused. Payments have
        their own history (GET /v1/payments/{key}).
      security:
        - session: []
      parameters:
        - name: action
          in: query
          schema:
            type: string
        - name: actor_id
          in: query
          description: A user ID.
          schema:
            type: string
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: One page of events.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  next_cursor:
                    $ref: "#/components/schemas/NextCursor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"

  /v1/agents:
    post:
      tags: [Agents]
      operationId: createAgent
      summary: Create an agent and its API key
